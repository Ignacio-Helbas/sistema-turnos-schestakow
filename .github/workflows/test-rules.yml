name: Pruebas de Reglas de Firestore (Emulator)

on:
  push:
    branches:
      - main
      - feature/**
      - auditoria-foro
  pull_request:

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java para Emulador de Firestore
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Instalar Firebase CLI y dependencias
        run: |
          npm install -g firebase-tools
          npm install

      - name: 5. Ejecutar suite de pruebas con Emulador de Firestore
        run: |
          firebase emulators:exec --only firestore "npm test"

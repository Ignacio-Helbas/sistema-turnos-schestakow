name: Pruebas de Reglas de Firestore (Emulator)

on:
  push:
    branches:
      - main
      - feature/**
      - auditoria-foro
  pull_request:

# Principio de privilegio mínimo
permissions:
  contents: read

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Configurar Java para Emulador de Firestore
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Configurar Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: '20'

      - name: 4. Instalar Firebase CLI y dependencias
        run: |
          npm install -g firebase-tools
          npm install
          cd functions && npm install

      - name: 5. Ejecutar suite de pruebas con Emulador de Firestore
        run: |
          firebase emulators:exec --project demo-turnos-schestakow --only firestore "npm test"

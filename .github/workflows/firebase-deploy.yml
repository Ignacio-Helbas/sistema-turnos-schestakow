name: Desplegar en Firebase

on:
  push:
    branches: 
      - main
      - mejoras/revision-seguridad

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: 3. Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: 4. Subir a Firebase (Hosting y Reglas de Firestore)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > ./firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-key.json"
          firebase deploy --project sistema-turnos-utn --only hosting,firestore:rules --non-interactive

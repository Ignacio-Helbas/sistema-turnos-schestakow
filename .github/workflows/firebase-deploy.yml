name: Desplegar en Firebase

on:
  push:
    branches: 
      - main
      - mejoras/revision-seguridad

# Principio de privilegio mínimo: permiso de solo lectura de repositorio
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Configurar Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: '20'

      - name: 3. Instalar Firebase CLI y dependencias de Functions
        run: |
          npm install -g firebase-tools
          cd functions && npm install

      - name: 4. Subir a Firebase (Hosting y Reglas de Firestore garantizados, Functions condicional a Blaze)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > ./firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-key.json"
          firebase deploy --project sistema-turnos-utn --only firestore:rules,hosting --non-interactive
          firebase deploy --project sistema-turnos-utn --only functions --non-interactive || echo "::warning::El despliegue de Cloud Functions requiere el plan Blaze de Firebase (pay-as-you-go). Hosting y Reglas fueron desplegados con exito."

      - name: 5. Limpieza garantizada de credencial temporal
        if: always()
        run: rm -f ./firebase-key.json

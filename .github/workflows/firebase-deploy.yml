name: Desplegar en Firebase (Plan Gratuito Spark)

on:
  push:
    branches: 
      - main
  workflow_dispatch:

# Principio de privilegio mínimo: permiso de solo lectura de repositorio
permissions:
  contents: read

jobs:
  deploy:
    name: Despliegue Spark (Hosting y Reglas de Firestore)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: '20'

      - name: 3. Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: 4. Desplegar en Firebase (Hosting y Reglas de Firestore)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > ./firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-key.json"
          firebase deploy --project sistema-turnos-utn --only hosting,firestore:rules --non-interactive

      - name: 5. Limpieza garantizada de credencial temporal
        if: always()
        run: rm -f ./firebase-key.json

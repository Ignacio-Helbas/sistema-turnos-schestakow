<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Teodoro J. Schestakow - Acceso Staff</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Estilos Externos -->
    <link rel="stylesheet" href="css/estilos.css">

    <!-- Fondo de Pantalla -->
    <style>
        body { 
            background-image: url('img/COVID-19-LABORATORIO-HOSPITAL-SCHESTAKOW-6714.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        @supports (-webkit-touch-callout: none) {
            body { background-attachment: scroll; }
        }
    </style>
</head>
<body class="text-slate-800 font-sans flex flex-col min-h-screen">

    <!-- Cabecera -->
    <header class="bg-white/95 backdrop-blur shadow-md sticky top-0 z-40 border-b border-blue-900/10">
        <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
            <div class="flex justify-between min-h-[5rem] py-2 md:py-0 items-center">
                <a href="index.html" class="flex items-center py-1 md:py-2 select-none">
                    <img src="img/LogoHospital.png" alt="Hospital Teodoro J. Schestakow" class="h-10 md:h-14 w-auto object-contain">
                </a>
                <a href="index.html" class="text-slate-600 hover:text-blue-800 font-bold text-xs md:text-sm px-3 py-2 rounded-md transition flex items-center gap-1">
                    ← Volver a Turnos
                </a>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal de Login -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 py-8 flex items-center justify-center">
        <div class="w-full max-w-md bg-white/95 backdrop-blur p-6 sm:p-8 rounded-xl shadow-xl border border-slate-200">
            <div class="text-center mb-6">
                <div class="inline-block bg-slate-100 p-4 rounded-full mb-3">
                    <svg class="w-8 h-8 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-slate-800">Acceso Restringido</h2>
                <p class="text-sm text-slate-500 mt-1">Portal exclusivo para Staff del Hospital</p>
            </div>

            <form id="form-login" class="space-y-5" onsubmit="event.preventDefault(); ejecutarLogin();">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1" for="login-user">Correo o Usuario</label>
                    <input type="text" id="login-user" required autocomplete="username" class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="usuario@hospital.com o usuario">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1" for="login-pass">Contraseña</label>
                    <input type="password" id="login-pass" required autocomplete="current-password" class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="••••••••••••">
                </div>
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-2">
                    <a href="index.html" class="text-sm text-slate-500 hover:text-slate-800 transition order-2 sm:order-1">Volver al inicio</a>
                    <button type="submit" id="btn-login" class="w-full sm:w-auto bg-slate-800 text-white font-bold py-2.5 px-6 rounded-lg hover:bg-slate-900 shadow transition order-1 sm:order-2 flex items-center justify-center gap-2">
                        <span id="btn-login-texto">Ingresar</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Modales de Notificación -->
    <div id="modal-alerta" role="dialog" aria-modal="true" class="modal fixed inset-0 modal-overlay items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 text-center animate-fade-in-up">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 id="alerta-titulo" class="text-xl font-bold text-slate-800 mb-2">Atención</h3>
            <p id="alerta-mensaje" class="text-slate-600 mb-6">Revise la información.</p>
            <button onclick="cerrarModal('modal-alerta')" class="w-full bg-slate-800 text-white font-bold py-2 rounded-lg hover:bg-slate-900 transition">Entendido</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs border-t border-slate-800">
        <p>Hospital Teodoro J. Schestakow &bull; Sistema de Gestión y Turnos Online</p>
    </footer>

    <!-- Script de Login Seguro -->
    <script type="module">
        import { iniciarSesionFirebase, auth, onAuthStateChanged } from "./js/firebase-config.js";
        import { mostrarAlerta, cerrarModal } from "./js/utils.js";

        window.cerrarModal = cerrarModal;

        // Si ya hay sesión activa no anónima, redirigir al panel
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                window.location.href = "panel.html";
            }
        });

        window.ejecutarLogin = async function() {
            const userEl = document.getElementById('login-user');
            const passEl = document.getElementById('login-pass');
            const btnEl = document.getElementById('btn-login');
            const txtEl = document.getElementById('btn-login-texto');

            const userInput = userEl.value.trim();
            const passInput = passEl.value.trim();

            if (!userInput || !passInput) {
                mostrarAlerta("Datos Faltantes", "Ingrese correo o nombre de usuario y contraseña.");
                return;
            }

            btnEl.disabled = true;
            if (txtEl) txtEl.innerText = "Verificando...";

            try {
                await iniciarSesionFirebase(userInput, passInput);
                window.location.href = "panel.html";
            } catch (error) {
                console.error("Error de login:", error);
                btnEl.disabled = false;
                if (txtEl) txtEl.innerText = "Ingresar";
                if (error.message === "USUARIO_NO_EXISTE") {
                    mostrarAlerta("Acceso Denegado", "El nombre de usuario especificado no existe.");
                } else if (error.message === "USUARIO_INACTIVO") {
                    mostrarAlerta("Cuenta Suspendida", "Su usuario ha sido deshabilitado institucionalmente.");
                } else {
                    mostrarAlerta("Acceso Denegado", "Credenciales incorrectas. Verifique usuario y contraseña.");
                }
            }
        };
    </script>
</body>
</html>
